[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "goodprice-shared-utils"
version = "0.1.0"
description = "Shared SQLAlchemy helpers and base models for GoodPrice services."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary"}
authors = [{name = "GoodPrice Platform Team"}]
dependencies = [
    "SQLAlchemy>=2.0,<3.0",
    "asyncpg>=0.29,<0.30",
    "psycopg2-binary>=2.9,<3.0",
]

[project.urls]
Repository = "https://example.com/goodprice/shared-utils"

[tool.setuptools.packages.find]
include = ["shared_utils*"]

